components:
  schemas:
    ApprovalInput:
      properties:
        action_type:
          type: string
          enum:
          - worker_availability
          - labour_request
          - assignment_confirmation
          - assignment_cancellation
          - work_completion
          - payment_issue
          - historical_work_relationship_claim
          title: Action Type
        fields:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
          type: object
          title: Fields
        entity_ids:
          additionalProperties:
            type: string
          type: object
          title: Entity Ids
        resolve_ambiguity:
          type: boolean
          title: Resolve Ambiguity
          default: false
      type: object
      required:
      - action_type
      title: ApprovalInput
    Body_upload_portrait_api_v1_onboarding_workers__worker_id__portrait_post:
      properties:
        asset_id:
          type: string
          format: uuid
          title: Asset Id
        object_path:
          type: string
          title: Object Path
        portrait:
          type: string
          contentMediaType: application/octet-stream
          title: Portrait
      type: object
      required:
      - asset_id
      - object_path
      - portrait
      title: Body_upload_portrait_api_v1_onboarding_workers__worker_id__portrait_post
    CancelAssignmentActionInput:
      properties:
        assignment_id:
          type: string
          format: uuid
          title: Assignment Id
        reason_code:
          type: string
          enum:
          - worker_withdrew
          - contractor_cancelled
          - job_cancelled
          - operator_cancelled
          - other
          title: Reason Code
        reason_text:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Reason Text
        expected_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - assignment_id
      - reason_code
      title: CancelAssignmentActionInput
    CancelAssignmentInput:
      properties:
        reason_code:
          type: string
          enum:
          - worker_withdrew
          - contractor_cancelled
          - job_cancelled
          - operator_cancelled
          - other
          title: Reason Code
        reason_text:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Reason Text
        expected_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - reason_code
      title: CancelAssignmentInput
    CancelLabourRequestInput:
      properties:
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        expected_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - reason
      title: CancelLabourRequestInput
    ConfirmAssignmentActionInput:
      properties:
        assignment_id:
          type: string
          format: uuid
          title: Assignment Id
        confirmed:
          type: boolean
          title: Confirmed
          default: true
        expected_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Version
      type: object
      required:
