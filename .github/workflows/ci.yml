name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        run: uv sync --project apps/api --locked

      - name: Check API formatting and lint
        run: pnpm api:lint

      - name: Typecheck API
        run: pnpm api:typecheck

      - name: Test API
        run: pnpm api:test

      - name: Check API contract
        run: pnpm api:openapi:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start local Supabase
        run: pnpm db:start

      - name: Generate local app environment
        run: pnpm env:local

      - name: Reset local database
        run: pnpm db:reset

      - name: Start FastAPI application
        run: |
          export SUPABASE_DB_URL="$(pnpm exec supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '\"')"
          export SUPABASE_JWT_SECRET="$(pnpm exec supabase status -o env | sed -n 's/^JWT_SECRET=//p' | tr -d '\"')"
          export SUPABASE_SERVICE_ROLE_KEY="$(pnpm exec supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '\"')"
          nohup uv run --project apps/api python apps/api/run.py > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Check generated database types
        run: pnpm db:types:check

      - name: Build production application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
